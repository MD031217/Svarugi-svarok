[project]
name = "weld-defect-api"
version = "0.1.0"
description = "FastAPI backend for YOLO weld defect detection"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.54,<0.55",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15,<3",
    "ultralytics==8.4.215",
    # Verified macOS ARM64 wheel; avoid the incompatible 5.1.0.95 candidates.
    "opencv-python==4.13.0.92",
    "pillow>=12,<13",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4,<10"
httpx = ">=0.28,<0.29"
ruff = ">=0.12,<1"
mypy = ">=1.17,<2"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["venv", ".venv", "dataset", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
files = ["app", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ultralytics.*"]
ignore_missing_imports = true
